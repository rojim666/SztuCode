[agent]
description = "plan agent：实现规划与架构设计专用，连 Shell 命令都不提供，专注想清楚怎么做"
prompt_id = "plan"
allowed_tools = [
    "read_file",
    "list_dir",
    "grep_search",
    "glob_search",
    "task_create",
    "task_update",
    "task_list",
    "task_get",
]
# 纵深防御：即便幻觉调用写/执行工具，也在权限层被拒绝
permission_mode = "plan"
# 规划任务步数适中
max_steps = 15
