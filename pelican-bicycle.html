<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  :root{
    --ink:#123244;
    --panel:rgba(255,255,255,.74);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    overflow:hidden;
    background:#0c1a24;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage{position:fixed;inset:0}
  .stage svg{display:block;width:100%;height:100%}

  .vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(125% 105% at 50% 42%, transparent 52%, rgba(6,24,36,.4) 100%);
  }

  .caption{
    position:fixed;left:clamp(16px,4vw,56px);top:clamp(16px,4vw,52px);
    padding:16px 24px 15px;
    border-radius:16px;
    background:var(--panel);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 14px 36px rgba(10,40,60,.2);
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  .caption h1{
    margin:0;
    font-size:clamp(19px,2.6vw,32px);
    letter-spacing:.14em;
    font-weight:700;
    color:var(--ink);
  }
  .caption p{
    margin:7px 0 0;
    font-size:clamp(10px,1.05vw,12px);
    letter-spacing:.24em;
    text-transform:uppercase;
    font-weight:600;
    color:#3d6b83;
  }
  @keyframes rise{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

  @keyframes drift{from{transform:translateX(-320px)}to{transform:translateX(1320px)}}
  .cloud{animation:drift linear infinite}
  .c1{animation-duration:56s}
  .c2{animation-duration:82s;animation-delay:-27s}
  .c3{animation-duration:44s;animation-delay:-11s}

  @keyframes waveShift{from{transform:translateX(0)}to{transform:translateX(100px)}}
  #waveA{animation:waveShift 7s linear infinite}
  #waveB{animation:waveShift 11s linear infinite}

  @keyframes dashShift{from{transform:translateX(0)}to{transform:translateX(-120px)}}
  #dashes{animation:dashShift .6s linear infinite}

  @media (prefers-reduced-motion: reduce){
    .cloud,#waveA,#waveB,#dashes{animation:none}
  }
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet"

      <path d="M470 434 L398 330"/>
      <path d="M470 434 L600 298"/>
      <path d="M398 330 L600 298"/>
      <path d="M600 298 L614 348"/>
      <path d="M614 348 L644 433"/>
    </g>

    <path d="M354 334 Q398 320 442 336 Q398 344 354 334 Z" fill="#2b3140"/>

    <g fill="none" stroke="#2b3140" stroke-width="9" stroke-linecap="round">

</div>

<div class="vignette"></div>

<div class="caption">
  <h1>鹈鹕骑自行车</h1>
  <p>Pelican on a Bicycle</p>
</div>

<script>
(function () {
  var BASE_W = 1000, BASE_H = 600;
  var svg = document.getElementById('scene');

  /* 按容器比例扩展 viewBox，保证整幅场景始终完整可见 */
  function fitViewBox() {
    var rect = svg.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    var aspect = rect.width / rect.height;
    var baseAspect = BASE_W / BASE_H;
    var vb;
    if (aspect >= baseAspect) {
      var w = BASE_H * aspect;
      vb = (BASE_W - w) / 2 + ' 0 ' + w + ' ' + BASE_H;
    } else {
      var h = BASE_W / aspect;
      vb = '0 ' + (BASE_H - h) / 2 + ' ' + BASE_W + ' ' + h;
    }
    svg.setAttribute('viewBox', vb);
  }
  fitViewBox();
  window.addEventListener('resize', fitViewBox);

  var BB = { x: 470, y: 434 };      // 中轴
  var CRANK_R = 24;                 // 曲柄长度
  var HIP = { x: 400, y: 320 };     // 髋关节
  var THIGH = 86, SHIN = 82;        // 大腿 / 小腿
  var GEAR = 2.7;                   // 传动比：曲柄转一圈，车轮转 2.7 圈

  var rearWheel = document.getElementById('rearWheel');
  var frontWheel = document.getElementById('frontWheel');
  var crank = document.getElementById('crank');
  var rider = document.getElementById('rider');

  var legs = {
    near: {
      thigh: document.getElementById('nearThigh'),
      shin: document.getElementById('nearShin'),
      foot: document.getElementById('nearFoot'),
      pedal: document.getElementById('nearPedal'),
      phase: 0
    },
    far: {
      thigh: document.getElementById('farThigh'),
      shin: document.getElementById('farShin'),
      foot: document.getElementById('farFoot'),
      pedal: document.getElementById('farPedal'),
      phase: Math.PI
    }
  };

  /* 两段式 IK：由髋关节与踏板位置解出膝盖坐标，膝盖始终朝前弯 */
  function solveLeg(hip, pedal) {
    var dx = pedal.x - hip.x;
    var dy = pedal.y - hip.y;
    var raw = Math.hypot(dx, dy) || 1e-6;
    var ux = dx / raw, uy = dy / raw;

    var d = Math.min(Math.max(raw, Math.abs(THIGH - SHIN) + 0.5), THIGH + SHIN - 0.5);
    var a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, THIGH * THIGH - a * a));

    var nx = uy, ny = -ux;
    if (nx < 0) { nx = -nx; ny = -ny; }

    return {
      kx: hip.x + ux * a + nx * h,
      ky: hip.y + uy * a + ny * h,
      px: hip.x + ux * d,
      py: hip.y + uy * d
    };
  }

  function drawLeg(leg, theta, hip) {
    var ang = theta + leg.phase;
    var pedal = {
      x: BB.x + CRANK_R * Math.cos(ang),
      y: BB.y + CRANK_R * Math.sin(ang)
    };
    var s = solveLeg(hip, pedal);

    leg.thigh.setAttribute('d', 'M' + hip.x + ' ' + hip.y + 'L' + s.kx + ' ' + s.ky);
    leg.shin.setAttribute('d', 'M' + s.kx + ' ' + s.ky + 'L' + s.px + ' ' + s.py);
    leg.foot.setAttribute('transform', 'translate(' + s.px + ' ' + s.py + ')');
    leg.pedal.setAttribute('transform', 'translate(' + s.px + ' ' + s.py + ')');
  }

  function render(theta) {
    var deg = theta * 180 / Math.PI;

    rearWheel.setAttribute('transform', 'rotate(' + (deg * GEAR) + ')');
    frontWheel.setAttribute('transform', 'rotate(' + (deg * GEAR) + ')');
    crank.setAttribute('transform', 'rotate(' + deg + ' ' + BB.x + ' ' + BB.y + ')');

    var bob = Math.sin(theta * 2) * 2.2;
    rider.setAttribute('transform', 'translate(0 ' + bob + ')');

    var hip = { x: HIP.x, y: HIP.y + bob };
    drawLeg(legs.far, theta, hip);
    drawLeg(legs.near, theta, hip);
  }

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    render(0.9);
    return;
  }

  var OMEGA = 4.2;                 // 踏频（弧度/秒）
  var start = null;

  function tick(now) {
    if (start === null) start = now;
    render(((now - start) / 1000) * OMEGA);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
