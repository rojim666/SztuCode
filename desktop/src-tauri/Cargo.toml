[package]
name = "sztucode-desktop"
version = "0.1.1"
description = "Local-first SztuCode agent workbench"
authors = ["SztuCode"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
base64 = "0.22"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.3", features = [ "unstable", "tray-icon"] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-opener = "2.5.0"
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "time"] }
window-vibrancy = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSResponder",
    "NSWindow",
    "NSView",
    "NSScreen",
    "NSGraphics",
    "NSApplication",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSGeometry",
    "NSThread",
] }
