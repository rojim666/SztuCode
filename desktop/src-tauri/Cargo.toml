[package]
name = "sztucode-desktop"
version = "0.1.0"
description = "Local-first SztuCode agent workbench"
authors = ["SztuCode"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.3", features = [] }
tauri-plugin-dialog = "2.4.0"
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "time"] }
