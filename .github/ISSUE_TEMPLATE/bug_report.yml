name: Bug report
description: 报告可复现的 SztuCode 缺陷
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请移除 API Key、私有源码、个人路径和未脱敏 Trace。安全漏洞请勿使用此模板，请前往 Security 页面私密报告。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 提供版本号或 `git rev-parse HEAD` 输出。
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: 客户端
      options:
        - Terminal chat (sztucode / sztucode-tui)
        - Desktop (Tauri)
        - Node CLI
        - Daemon / IPC
        - 其他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Node.js 版本；桌面问题另附 Rust/Tauri 版本。若问题来自 artifact Skill，再补充对应工具版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供最小、稳定、可重复的步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志或 Trace
      render: shell
  - type: dropdown
    id: impact
    attributes:
      label: 是否涉及工作区写入、权限或数据丢失
      options:
        - 否
        - 是，已备份且没有安全影响
        - 可能涉及安全问题，我将改用私密漏洞报告
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现重复问题。
          required: true
        - label: 内容不包含凭据、私有源码或个人敏感信息。
          required: true
