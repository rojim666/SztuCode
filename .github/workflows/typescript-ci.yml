name: TypeScript CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typescript-checks:
    name: Node and TypeScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Office offline acceptance
        run: |
          npm run office:eval
          npx tsx --test packages/runtime-ts/tests/operation-store.test.ts packages/runtime-ts/tests/durable-checkpoint.test.ts packages/runtime-ts/tests/scheduler.test.ts packages/runtime-ts/tests/connectors.test.ts packages/runtime-ts/tests/workspace-indexer.test.ts

      - name: Build
        run: npm run build

      - name: Check generated protocol documentation
        run: npm run docs:protocol && git diff --exit-code -- docs/reference/wire-protocol.md

      - name: Check Markdown links
        run: npm run docs:links
