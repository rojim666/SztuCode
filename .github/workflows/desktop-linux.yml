name: Linux Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-linux.yml"
      - "desktop/**"
      - "packages/protocol/**"
      - "packages/runtime-ts/**"
      - "scripts/prepare-skill-assets.js"
      - "package-lock.json"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desktop-linux.yml"
      - "desktop/**"
      - "packages/protocol/**"
      - "packages/runtime-ts/**"
      - "scripts/prepare-skill-assets.js"
      - "package-lock.json"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Build AppImage and deb
        working-directory: desktop
        env:
          NO_STRIP: "true"
        # --verbose：tauri-bundler 默认吞掉 linuxdeploy 的 stdout/stderr，
        # 失败时只剩一句 "failed to run linuxdeploy"，无法定位根因
        run: npm run tauri build -- --bundles appimage,deb -- --verbose

      - name: Verify bundled daemon
        run: |
          test -x desktop/src-tauri/resources/runtime/node
          test -f desktop/src-tauri/resources/runtime/main.js
          find desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -type f | grep -q .
          find desktop/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f | grep -q .

      - name: Upload AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SztuCode-0.1.1-linux-x86_64-AppImage
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SztuCode-0.1.1-linux-x86_64-deb
          path: desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
